apiVersion: apps/v1
kind: Deployment
metadata:
  name: departmentcrud-deployment
  labels:
    app: departmentcrud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: departmentcrud
  template:
    metadata:
      labels:
        app: departmentcrud
    spec:
      containers:
        - name: departmentcrud
          image: departmentcrud:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: departmentcrud-service
  labels:
    app: departmentcrud
spec:
  type: ClusterIP
  selector:
    app: departmentcrud
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
